<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>License Scanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <button id="btn-toggle-panel" class="btn-toggle-panel" title="Toggle scan panel"></button>
    <img src="icon.png" alt="" class="header-icon" />
    <div>
      <h1>License Scanner</h1>
      <p class="subtitle">Scan or paste barcode data below — fields will populate automatically</p>
    </div>
  </header>

  <main>

    <section class="scan-section" id="scan-panel">
      <label for="scan-input">Barcode Input</label>
      <textarea
        id="scan-input"
        placeholder="Click this box, then scan the back of the license with the barcode scanner."
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div class="scan-actions">
        <button id="btn-parse" class="btn-primary">Parse</button>
        <button id="btn-clear" class="btn-secondary">Clear All</button>
        <span id="status-badge" class="badge hidden"></span>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <h2>Parsed Fields</h2>
        <button id="btn-copy-all" class="btn-secondary" disabled hidden>Copy All as Text</button>
      </div>
      <div class="field-grid" id="field-grid"></div>
    </section>

    <div id="scan-overlay" class="scan-overlay hidden"></div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
